# Log-based alerts. Owner: Kofi (SRE). Changes need SRE review (CONTRIBUTING.md).
#
# The log pipeline checks every raw log line against each `match` as a
# case-insensitive substring. That works for the old hl_log lines and the new
# JSON lines alike.

- name: PaymentsDeclineSpike
  match: "payment declined"
  threshold: 20 in 5m
  page: payments-oncall

# PaymentsDeclineSpike for payments' harbor_obs JSON lines (logmig). Same threshold and
# page as PaymentsDeclineSpike. Both rules stay while old and new payments builds run;
# delete PaymentsDeclineSpike in a follow-up PR once every instance runs harbor_obs.
- name: PaymentsDeclineSpikeJson
  match: '"service": "payments", "event": "payment_declined"'
  threshold: 20 in 5m
  page: payments-oncall

- name: TrackingFeedStale
  match: "tracking feed stale"
  threshold: 1 in 15m
  page: ops-oncall

- name: BookingLaneFull
  match: "no capacity on lane"
  threshold: 10 in 10m
  page: ops-oncall

# BookingLaneFull for bookings' harbor_obs JSON lines (logmig). Same threshold and
# page as BookingLaneFull. Both rules stay while old and new bookings builds run;
# delete BookingLaneFull in a follow-up PR once every instance runs harbor_obs.
- name: BookingLaneFullJson
  match: '"service": "bookings", "event": "lane_no_capacity"'
  threshold: 10 in 10m
  page: ops-oncall
